<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>琥比遊戲間 · 360 全景</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #050807; color: #eee6d2; font-family: "Microsoft JhengHei", system-ui, sans-serif; }
    #overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: #050807; text-align: center; }
    #overlay h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: 4px; color: #f2c566; }
    #overlay p { margin: 0; color: #a9b8ad; font-size: 13px; }
    #hud { position: fixed; left: 18px; bottom: 16px; z-index: 5; font-size: 12px; color: #aebbb2; background: rgba(5,8,7,.55); padding: 8px 12px; border: 1px solid rgba(120,160,145,.25); border-radius: 6px; }
    #hud a { color: #9fe0d5; text-decoration: none; margin-left: 10px; }
    #title { position: fixed; left: 18px; top: 16px; z-index: 5; font-size: 15px; letter-spacing: 4px; color: #f2c566; }
    #title small { display: block; font-size: 10px; letter-spacing: 3px; color: #7fd6c8; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="title">HOOBE GAME ROOM<small>360° PANORAMA</small></div>
  <div id="hud">拖曳環視 · Quest 2 按 ENTER VR · <a href="index.html">回 3D 房間</a> · <a href="../">回 琥比遊戲間</a></div>
  <div id="overlay"><div><h1>360° 全景</h1><p>載入琥比遊戲間環景…</p></div></div>

  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    const overlay = document.getElementById('overlay');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050807);
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 0);
    camera.rotation.order = 'YXZ';

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(20, 64, 40),
      new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: 0xffffff })
    );
    sphere.position.set(0, 1.6, 0);
    scene.add(sphere);

    new THREE.TextureLoader().load(
      'hoobe_360.png',
      (tex) => {
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        // SphereGeometry 用 BackSide 從球內看，等向投影貼圖會左右鏡射（招牌字會反）
        // 用 texture 的 U 軸翻轉修正，不動幾何、不影響面剔除
        tex.wrapS = THREE.RepeatWrapping;
        tex.repeat.x = -1;
        tex.offset.x = 1;
        sphere.material.map = tex;
        sphere.material.needsUpdate = true;
        overlay.style.display = 'none';
      },
      undefined,
      () => {
        overlay.querySelector('p').textContent = '找不到 hoobe_360.png；請確認檔案在同一資料夾。';
      }
    );

    // simple drag look (in VR the headset controls orientation)
    let lon = -Math.PI / 2; // equirect center
    let lat = 0;
    let down = false, px = 0, py = 0;
    const el = renderer.domElement;
    el.addEventListener('pointerdown', (e) => { down = true; px = e.clientX; py = e.clientY; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointerup', (e) => { down = false; });
    el.addEventListener('pointermove', (e) => {
      if (!down) return;
      lon -= (e.clientX - px) * 0.005;
      lat = Math.max(-1.2, Math.min(1.2, lat - (e.clientY - py) * 0.005));
      px = e.clientX; py = e.clientY;
    });
    camera.rotation.y = lon;
    camera.rotation.x = lat;

    document.body.appendChild(VRButton.createButton(renderer));
    renderer.setAnimationLoop(() => {
      if (!renderer.xr.isPresenting) {
        camera.rotation.y = lon;
        camera.rotation.x = lat;
      }
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
