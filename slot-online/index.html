<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>琥比水果盤・連線版 — HOOBE 琥比遊戲間</title>
<meta name="description" content="HOOBE 琥比水果盤連線版：多人同房、共用一台機台的線上版水果盤（建置中）。">
<meta property="og:title" content="琥比水果盤・連線版">
<meta property="og:description" content="多人同房、共用一台機台的線上版水果盤（建置中）。">
<meta property="og:image" content="https://casalinpda-tech.github.io/hoobe/assets/hubi.jpg">
<link rel="icon" href="../assets/hub.gif">
<style>
  :root{
    --case:#242526; --case2:#3a3b3c; --line:#4a4c4e;
    --lcd:#b3b1a3; --lcd2:#a7a596; --ink:#14140f;
    --teal:#2fb8a8; --gold:#c9a227; --red:#b3202a; --blk:#1d1d1d;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:#141617}
  body{
    min-height:100vh; color:#e7eaea;
    background-color:#141617; background-image:radial-gradient(circle at 50% 0%, #2b2f31 0%, #141617 70%);
    background-repeat:no-repeat; background-size:100% 1200px;
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    padding:24px 18px 60px; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px; margin:0 auto}
  .back{display:inline-block; margin-bottom:16px; color:#9aa0a3; text-decoration:none; font-size:13.5px; letter-spacing:1px}
  .back:hover{color:var(--teal)}
  .case{
    position:relative; background:linear-gradient(180deg,var(--case2) 0%,var(--case) 100%);
    border-radius:16px; padding:26px 24px;
    box-shadow:0 24px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.5);
  }
  .tag{position:absolute; top:16px; right:16px; font-size:11px; letter-spacing:1px; padding:4px 10px; border-radius:99px;
       color:var(--gold); background:rgba(201,162,39,.14); box-shadow:inset 0 0 0 1px rgba(201,162,39,.5)}
  h1{margin:0 0 10px; font-size:25px; letter-spacing:2px}
  p{margin:0 0 12px; color:#b6bcbe; font-size:14.5px; line-height:1.9}
  .lede{color:#dfe3e4}
  /* 展示：三台機器連線的示意 */
  .art{
    margin:18px 0 6px; display:flex; align-items:center; justify-content:center; gap:10px;
    background:linear-gradient(160deg,#c0beb0 0%,var(--lcd) 38%,var(--lcd2) 72%,#b8b6a8 100%);
    border-radius:8px; padding:16px 12px; position:relative; overflow:hidden;
    box-shadow:inset 0 0 22px rgba(0,0,0,.22), 0 0 0 5px #1c1d1e, 0 0 0 6px var(--line);
  }
  .art::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px)}
  .art::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(118deg, rgba(255,255,255,.3) 0%, rgba(255,255,255,.04) 26%, transparent 52%)}
  .mini{background:linear-gradient(180deg,#cfccbd,#b6b3a4); border-radius:6px; padding:6px 7px;
        box-shadow:inset 0 0 14px rgba(0,0,0,.35), 0 0 0 3px #1c1d1e; display:flex; gap:5px}
  .mini img{width:22px; height:22px; object-fit:contain; background:rgba(255,255,255,.5); border-radius:4px; padding:1px}
  .link{color:var(--teal); font-weight:700}
  .bar{height:3px; border-radius:2px; flex:0 0 34px; background:repeating-linear-gradient(90deg, rgba(20,20,15,.55) 0 6px, transparent 6px 12px)}
  .note{background:rgba(255,255,255,.045); border-left:3px solid var(--gold); border-radius:8px;
        padding:12px 14px; color:#cfd4d6; font-size:13.5px; line-height:1.9}
  .btn{display:inline-block; margin-top:16px; text-decoration:none; font-size:14px; font-weight:700; letter-spacing:1px;
       color:#0d1f1d; background:linear-gradient(180deg,#4fd0c0,#2fb8a8); padding:11px 22px; border-radius:9px;
       box-shadow:0 6px 16px rgba(47,184,168,.25)}
  .btn:hover{filter:brightness(1.08)}
  .btn2{display:inline-block; margin:16px 0 0 10px; text-decoration:none; font-size:13.5px; letter-spacing:1px;
        color:#dfe3e4; background:#2b2d2e; border:1px solid var(--line); border-radius:9px; padding:11px 18px}
  .btn2:hover{border-color:var(--teal); color:var(--teal)}
  footer{margin-top:22px; color:#8d9395; font-size:12.5px; line-height:2; text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">← 回琥比遊戲間</a>
  <section class="case">
    <div class="tag">建置中</div>
    <h1>琥比水果盤・連線版</h1>
    <p class="lede">多人同房、共用同一台機台 —— 看得到別的玩家，也看得到誰中獎。</p>

    <div class="art">
      <div class="mini"><img src="../slot/noto_emoji/西瓜.svg" alt=""><img src="../slot/noto_emoji/星星.svg" alt=""><img src="../slot/hoobe.gif" alt="琥比"></div>
      <div class="bar"></div>
      <div class="mini"><img src="../slot/noto_emoji/柳橙.svg" alt=""><img src="../slot/noto_emoji/鈴鐺.svg" alt=""><img src="../slot/noto_emoji/櫻桃.svg" alt=""></div>
      <div class="bar"></div>
      <div class="mini"><img src="../slot/noto_emoji/葡萄.svg" alt=""><img src="../slot/noto_emoji/檸檬.svg" alt=""><img src="../slot/noto_emoji/西瓜.svg" alt=""></div>
    </div>

    <p class="note">這個位子先留給連線版，目前還在整備中。<br>
      整備完成後，這裡會直接開玩 —— 免安裝、免註冊，開網址就能跟別人同一房。</p>

    <a class="btn" href="../slot/">先玩單機版 ▶</a>
    <a class="btn2" href="../roulette/">去玩完整版輪盤</a>
  </section>
  <footer>HOOBE　琥比遊戲間 —— 為紀念琥比而做。</footer>
</div>
<!-- 給隔壁台（水果盤專員）：交接說明在 ./handoff.txt；主檔直接覆蓋本頁 index.html 即可，資源檔放同一層。 -->
</body>
</html>
