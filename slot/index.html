        let guaranteedSpecialJackpot = null;
        
        function getSpecialJackpotPattern(type) {
            if (type === 'plus') {
                return ['HUBI', '🍒', 'HUBI', '🍒', '🍒', '🍒', 'HUBI', '🍒', 'HUBI'];
            } else if (type === 'cross') {
                return ['🍒', 'HUBI', '🍒', 'HUBI', '🍒', 'HUBI', '🍒', 'HUBI', '🍒'];
            } else if (type === 'super') {
                return ['🍒', '🍒', '🍒', '🍒', '🍒', '🍒', '🍒', '🍒', '🍒'];
            }
            return null;
        }
        
        function getJackpotSymbol() {
            if (guaranteedSpecialJackpot) {
                let symbol = guaranteedSpecialJackpot;
                guaranteedSpecialJackpot = null;
                
                if (symbol === 'cross') {
                    const crossOptions = ['🍉', '🔔', '⭐'];
                    symbol = crossOptions[Math.floor(Math.random() * crossOptions.length)];
                } else if (symbol === 'plus') {
                    const plusOptions = ['🍇', '🍊', '🍋'];
                    symbol = plusOptions[Math.floor(Math.random() * plusOptions.length)];
                } else if (symbol === 'super') {
                    symbol = HUBI_SYMBOL;
                }
                return symbol;
            }
            // superTrigger 到了：強制下一轉普通全盤出 🍒，觸發超級特別獎→琥比全盤
            if (totalSpins >= superTrigger) {
                return '🍒';
            }
            const normalSymbols = JACKPOT_SYMBOLS.filter(s => s !== 'HUBI' && s !== '🍒');
            return normalSymbols[Math.floor(Math.random() * normalSymbols.length)];
        }

        function setNextJackpotType(type) {
            if (type === 'cross') {
                const symbols = ['🍉', '🔔', '⭐'];
                guaranteedSpecialJackpot = symbols[Math.floor(Math.random() * symbols.length)];
            } else if (type === 'plus') {
                const symbols = ['🍇', '🍊', '🍋'];
                guaranteedSpecialJackpot = symbols[Math.floor(Math.random() * symbols.length)];
            } else if (type === 'super') {
                guaranteedSpecialJackpot = 'HUBI';
            } else {
                // 直接設置水果符號
                guaranteedSpecialJackpot = type;
            }
        }

        function spin() {
            if (isSpinning || coins < currentBet) return;

            clearSpecialPauseTimer(); // 手動按轉動時取消任何等待計時

            savedSpecialType = specialAwardType;
            
            updateWinDisplay(0);
            isHubiJackpotShowing = false;
            clearPaylines();
            clearPayoutHighlights();
            document.querySelectorAll('.reel').forEach(reel => {
                reel.classList.remove('hubi-jackpot', 'guaranteed', 'cross-bg');
            });

            coins -= currentBet;
            totalSpins++;
            hubiPoints++;
            updateDisplay();
            saveGame();
            isSpinning = true;

            document.getElementById('spinBtn').disabled = true;
            document.getElementById('autoSpinBtn').disabled = true;
            document.querySelectorAll('.reel').forEach(reel => {
                reel.classList.add('spinning');
            });

            const reels = document.querySelectorAll('.reel');
            const finalResults = [];
            
            // 特別獎直接顯示圖形（跳過緩衝畫面，直接出十字/交叉排列）
            if (guaranteedSpecialJackpot && !guaranteedJackpot && guaranteedSpecialJackpot !== 'HUBI') {
                const specialType = guaranteedSpecialJackpot;
                const pattern = getSpecialJackpotPattern(specialType);
                if (pattern) {
                    for (let i = 0; i < 9; i++) {
                        finalResults.push(pattern[i]);
                    }
                    guaranteedSpecialJackpot = null;
                    specialAwardType = specialType;
                    savedSpecialType = specialType;
                    guaranteedJackpot = true;
                } else {
                    for (let i = 0; i < 9; i++) {
                        finalResults.push(getRandomSymbol());
                    }
                }
            } else if (guaranteedJackpot) {
                const specialType = guaranteedSpecialJackpot || savedSpecialType;
                
                if (specialType === 'HUBI') {
                    guaranteedJackpot = false;
                    guaranteedSpecialJackpot = null;
                    for (let i = 0; i < 9; i++) {
                        finalResults.push(HUBI_SYMBOL);
                    }
                } else if (specialType === 'super') {
                    guaranteedJackpot = false;
                    guaranteedSpecialJackpot = null;
                    for (let i = 0; i < 9; i++) {
                        finalResults.push('🍒');
                    }
                } else if (['🍇', '🍊', '🍋', '🍉', '🔔', '⭐'].includes(specialType)) {
                    guaranteedJackpot = false;
                    guaranteedSpecialJackpot = null;
                    for (let i = 0; i < 9; i++) {
                        finalResults.push(specialType);
                    }
                } else {
                    const pattern = getSpecialJackpotPattern(specialType);
                    if (pattern) {
                        // 清除 guaranteedSpecialJackpot 讓 checkWin 能偵測圖案
                        guaranteedSpecialJackpot = null;
                        // 保留 guaranteedJackpot，讓 post-spin 知道還在特別獎流程中
                        for (let i = 0; i < 9; i++) {
                            finalResults.push(pattern[i]);
                        }
                        // 手動設定 specialAwardType，因為 checkWin 的偵測區塊被 guaranteedJackpot 擋住
                        specialAwardType = specialType;
                        savedSpecialType = specialType;
                    } else {
                        for (let i = 0; i < 9; i++) {
                            finalResults.push(getRandomSymbol());
                        }
                    }
                }
            } else if (totalSpins >= normalJackpotTrigger) {
                normalJackpotTrigger = totalSpins + Math.floor(Math.random() * 700) + 800;
                const jackpotSymbol = getJackpotSymbol();
                for (let i = 0; i < 9; i++) {
                    finalResults.push(jackpotSymbol);
                }
            } else {
                for (let i = 0; i < 9; i++) {
                    finalResults.push(getRandomSymbol());
                }
            }
            
            if (finalResults.length === 0) {
                for (let i = 0; i < 9; i++) {
                    finalResults.push(getRandomSymbol());
                }
            }

            let spinCount = 0;
            const totalSpinsAnim = 20;
            const spinInterval = setInterval(() => {
                reels.forEach(reel => {
                    const symbol = getRandomSymbol();
                    reel.innerHTML = getSymbolContent(symbol);
                });
                playSound('spin');
                spinCount++;

                if (spinCount >= totalSpinsAnim) {
                    clearInterval(spinInterval);
                    
                    stopReelsOneByOne(reels, finalResults, 0);
                }
            }, 120);
        }

        function stopReelsOneByOne(reels, finalResults, index) {
            if (index < 9) {
                reels[index].innerHTML = getSymbolContent(finalResults[index]);
                reels[index].classList.remove('spinning');
                playSound('stop');
                
                setTimeout(() => {
                    stopReelsOneByOne(reels, finalResults, index + 1);
                }, 200);
            } else {
                setTimeout(() => {
                    checkWin(finalResults);
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('autoSpinBtn').disabled = false;
                    updateBetButtonsState();
                    
                    if (guaranteedSpecialJackpot && !guaranteedJackpot) {
                        if (guaranteedSpecialJackpot === 'super') {
                            guaranteedJackpot = true;
                            // 超級特別獎：不排程下一轉，等跑分完成後自動觸發琥比全盤
                        } else {
                            guaranteedJackpot = true;
                            if (coins < currentBet) {
                                coins = currentBet * 10;
                                updateDisplay();
                            }
                            if (autoSpin) {
                                autoSpinInterval = setTimeout(spin, 1500);
                            }
                        }
                    } else if (guaranteedJackpot && (specialAwardType === 'plus' || specialAwardType === 'cross')) {
                        const fruitOptions = specialAwardType === 'plus' 
                            ? ['🍇', '🍊', '🍋'] 
                            : ['🍉', '🔔', '⭐'];
                        if (!guaranteedSpecialJackpot || ['🍇', '🍊', '🍋', '🍉', '🔔', '⭐'].indexOf(guaranteedSpecialJackpot) === -1) {
                            guaranteedSpecialJackpot = fruitOptions[Math.floor(Math.random() * fruitOptions.length)];
                        }
                        // 清掉 specialAwardType，下一轉全盤時不再亮特別獎框
                        specialAwardType = null;
                        if (autoSpin) startSpecialPauseTimer();
                    } else if (savedSpecialType === 'super') {
                        // 超級流程：checkWin 已設定 guaranteedSpecialJackpot = 'HUBI'
                        // 這裡不能清掉它，要保持讓下一轉開出琥比全盤
                        specialAwardType = null;
                        // 10秒等待移到櫻桃跑分完成後（manualScoreWin內啟動），避免時間競賽
                    } else if (guaranteedSpecialJackpot && ['🍇', '🍊', '🍋', '🍉', '🔔', '⭐'].includes(guaranteedSpecialJackpot)) {
                        // 固定圖案轉動完成，用10秒暫停取代停止自動
                        if (autoSpin) startSpecialPauseTimer();
                    } else if (autoSpin && coins >= currentBet && !isHubiJackpotShowing) {
                        autoSpinInterval = setTimeout(spin, 2500);
                    }
                }, 300);
            }
        }

        function checkWin(results) {
            let totalWin = 0;
            let winningLines = [];
            let isJackpot = false;
            let isHubiJackpot = false;
            let hubiPointsBeforeAward = 0;
            let jackpotSymbol = null;

            const allSame = results.every(s => s === results[0]);
            if (allSame) {
                isJackpot = true;
                jackpotSymbol = results[0];
                const allPayout = ALL_PAYOUTS[jackpotSymbol] || 50;
                totalWin += currentBet * allPayout;
                if (jackpotSymbol === HUBI_SYMBOL) {
                    isHubiJackpot = true;
                    hubiJackpotCount++;
                    lastHubiJackpotSpin = totalSpins;
                    hubiPointsBeforeAward = hubiPoints;
                }
            }

            const cherryLines = [];
            const diagonalLines = [];
            const plusLines = [];
            
            let cherryPlusTwoAny = 0;
            let cherryPlusTwoAnyLines = [];
            let twoCherriesOneAny = 0;
            let twoCherriesOneAnyLines = [];
            
            PAYLINES.forEach((line, lineIndex) => {
                const symbols = line.map(i => results[i]);
                const uniqueSymbols = [...new Set(symbols)];
                const cherryCount = symbols.filter(s => s === '🍒').length;
                
                if (uniqueSymbols.length === 1) {
                    const symbol = uniqueSymbols[0];
                    const payout = PAYOUTS[symbol];
                    totalWin += payout * currentBet;
                    winningLines.push({ line: lineIndex, symbol: symbol });
                    
                    if (symbol === '🍒') {
                        cherryLines.push(lineIndex);
                        if (lineIndex === 6 || lineIndex === 7) {
                            diagonalLines.push(lineIndex);
                        }
                        if (lineIndex === 4 || lineIndex === 1) {
                            plusLines.push(lineIndex);
                        }
                    }
                }

                if (symbols[0] === '🍒' && symbols[1] !== '🍒') {
                    cherryPlusTwoAny++;
                    cherryPlusTwoAnyLines.push(lineIndex);
                }
                if (symbols[0] === '🍒' && symbols[1] === '🍒' && symbols[2] !== '🍒') {
                    twoCherriesOneAny++;
                    twoCherriesOneAnyLines.push(lineIndex);
                }
            });

            if (cherryPlusTwoAny > 0) {
                totalWin += currentBet * 0.3 * cherryPlusTwoAny;
                cherryPlusTwoAnyLines.forEach(lineIndex => {
                    winningLines.push({ line: lineIndex, symbol: 'cherry+2any' });
                });
            }
            if (twoCherriesOneAny > 0) {
                totalWin += currentBet * 0.45 * twoCherriesOneAny;
                twoCherriesOneAnyLines.forEach(lineIndex => {
                    winningLines.push({ line: lineIndex, symbol: '2cherry+any' });
                });
            }

            // 如果 guaranteedSpecialJackpot 已經設置，說明正在進行特別獎流程，跳過所有觸發邏輯
            // 只有當 guaranteedSpecialJackpot 為 null 且 guaranteedJackpot 為 false 時才觸發新的特別獎
            // 加上 savedSpecialType !== 'super/plus/cross' 避免流程中的 checkWin 重新觸發（燈框誤亮）
            const specialWasPreSet = !!guaranteedSpecialJackpot; // 記錄是否在這次 checkWin 前就已設定
            if (!guaranteedSpecialJackpot && !guaranteedJackpot && savedSpecialType !== 'super' && savedSpecialType !== 'plus' && savedSpecialType !== 'cross') {
                if (totalSpins >= plusAwardTrigger) {
                    plusAwardTrigger = totalSpins + Math.floor(Math.random() * 200) + 500;
                    const rand = Math.random();
                    if (rand < 0.8) {
                        guaranteedSpecialJackpot = 'plus';
                    } else {
                        guaranteedSpecialJackpot = 'cross';
                    }
                    // 不設 specialAwardType，避免本次 checkWin 誤亮燈框（隨機觸發是為下一轉準備）
                }

                // 特別獎觸發
                // 琥比全盤（超級特別獎）—— 唯一出琥比的路徑
                if (cherryLines.length === 8 && totalSpins >= superTrigger) {
                    guaranteedSpecialJackpot = 'super';
                    specialAwardType = 'super';
                } else if (diagonalLines.length === 2 && cherryLines.length !== 8 && guaranteedSpecialJackpot !== 'super') {
                    guaranteedSpecialJackpot = 'cross';
                    specialAwardType = 'cross';
                } else if (plusLines.length === 2 && cherryLines.length !== 8 && guaranteedSpecialJackpot !== 'super') {
                    guaranteedSpecialJackpot = 'plus';
                    specialAwardType = 'plus';
                }
            }
            
            // 如果 guaranteedJackpot 為 true，說明正在進行特別獎流程
            // 設定 specialAwardType（可能來自隨機觸發器或測試鍵）
            if (guaranteedJackpot && specialAwardType === null) {
                if (guaranteedSpecialJackpot === null) {
                    specialAwardType = 'plus';
                } else if (guaranteedSpecialJackpot === 'plus' || guaranteedSpecialJackpot === 'cross') {
                    specialAwardType = guaranteedSpecialJackpot;
                }
            }

            if (totalWin > 0 || isJackpot) {
                // 判斷是否為緩衝畫面（特別獎前的第一個畫面）
                const isBufferScreen = guaranteedSpecialJackpot && !guaranteedJackpot;
                
                // 滿天星：星星全盤時切換為星空背景（特別獎流程中不覆蓋）
                if (isJackpot && jackpotSymbol === '⭐') {
                    // 特別獎流程中維持原本的特別獎背景色
                    if (specialAwardType) {
                        if (specialAwardType === 'plus') setReelsBackground('plus');
                        else if (specialAwardType === 'super') setReelsBackground('super');
                        else if (specialAwardType === 'cross') setReelsBackground('cross');
                    } else if (persistentSpecialBg) {
                        setReelsBackground(persistentSpecialBg);
                    } else {
                        setReelsBackground('starry');
                    }
                } else if (guaranteedSpecialJackpot) {
                    if (specialAwardType === 'plus') {
                        setReelsBackground('plus');
                    } else if (specialAwardType === 'super') {
                        setReelsBackground('super');
                    } else if (specialAwardType === 'cross') {
                        setReelsBackground('cross');
                    }
                }
                
                // 如果是擔保大獎（固定圖案轉動），添加 guaranteed 類
                if (guaranteedJackpot) {
                    const reels = document.querySelectorAll('.reel');
                    reels.forEach(reel => {
                        reel.classList.add('guaranteed');
                        // 根據特別獎類型設定正確的背景色（使用 savedSpecialType 備援）
                        const bgType = specialAwardType || savedSpecialType;
                        if (bgType === 'cross') {
                            reel.classList.add('cross-bg');
                        }
                    });
                }
                
                const winSymbols = winningLines.map(w => w.symbol);
                if (jackpotSymbol) {
                    winSymbols.push(jackpotSymbol);
                }
                if (cherryPlusTwoAny > 0) {
                    for (let i = 0; i < cherryPlusTwoAny; i++) winSymbols.push('cherry+2any');
                }
                if (twoCherriesOneAny > 0) {
                    for (let i = 0; i < twoCherriesOneAny; i++) winSymbols.push('2cherry+any');
                }
                
                // 特別獎燈框：只有當圖形在畫面上時才亮燈框
                // - 十字/交叉：guaranteedSpecialJackpot 有值且圖形顯示中
                // - 超級：櫻桃全盤時亮
                const patternOnScreen = 
                    ((specialAwardType === 'plus' || specialAwardType === 'cross') && guaranteedJackpot && !isJackpot) ||
                    (specialAwardType === 'super' && isJackpot);
                highlightPayoutItems(winSymbols, patternOnScreen ? specialAwardType : null, isJackpot, jackpotSymbol);
                
                
                // 超級特別獎（9櫻桃）：顯示特別獎表演，跑分完成後為下一次轉動準備全盤
                if (specialAwardType === 'super' && isJackpot) {
                    pendingWin = Math.floor(totalWin);
                    updateWinDisplay(0);
                    
                    function manualScoreWin() {
                        if (pendingWin > 0 && isHubiJackpotShowing) {
                            const step = Math.min(5, pendingWin);
                            coins += step;
                            pendingWin -= step;
                            updateWinDisplay(pendingWin);
                            updateDisplay();
                            playSound('pointAdd');
                            setTimeout(manualScoreWin, 20);
                        } else if (pendingWin === 0 && isHubiJackpotShowing) {
                            isHubiJackpotShowing = false;
                            specialAwardType = null;
                            clearPaylines();
                            clearPayoutHighlights();
                            document.querySelectorAll('.reel').forEach(reel => {
                                reel.classList.remove('hubi-jackpot');
                            });
                            // 重新設置 guaranteedSpecialJackpot，下次轉動開出琥比全盤
                            guaranteedSpecialJackpot = 'HUBI';
                            guaranteedJackpot = true;
                            // 櫻桃分數跑完後才開始10秒等待
                            if (autoSpin) startSpecialPauseTimer();
                        }
                    }
                    
                    isHubiJackpotShowing = true;
                    setTimeout(manualScoreWin, 1500);
                } else if (isJackpot) {
                    pendingWin = Math.floor(totalWin);
                    updateWinDisplay(0);
                    
                    function manualScoreWin() {
                        if (pendingWin > 0 && isHubiJackpotShowing) {
                            const step = Math.min(5, pendingWin);
                            coins += step;
                            pendingWin -= step;
                            updateWinDisplay(pendingWin);
                            updateDisplay();
                            playSound('pointAdd');
                            setTimeout(manualScoreWin, 20);
                        } else if (pendingWin === 0 && isHubiJackpotShowing) {
                            if (isHubiJackpot) {
                                setTimeout(() => {
                                    playSound('award');
                                    showMessage('🏆 頒獎中... 🏆', false);
                                    
                                    // 依押分比例決定消耗多少積分（押100=全消，押10=消10%）
                                    const maxBet = 100;
                                    const pointsToConsume = Math.ceil(hubiPointsBeforeAward * currentBet / maxBet);
                                    const remainingPoints = hubiPointsBeforeAward - pointsToConsume;
                                    let pointsToAward = pointsToConsume;
                                    let coinsPerPoint = totalWin / pointsToConsume;
                                    let coinCounter = 0;
                                    
                                    function countDownPoints() {
                                        if (pointsToAward > 0 && isHubiJackpotShowing) {
                                            const step = Math.min(5, pointsToAward);
                                            pointsToAward -= step;
                                            coinCounter += coinsPerPoint * step;
                                            // 顯示總積分平順下降（消耗部分+保留部分）
                                            hubiPoints = remainingPoints + pointsToAward;
                                            const coinsToAdd = Math.floor(coinCounter);
                                            if (coinsToAdd >= 1) {
                                                coins += coinsToAdd;
                                                coinCounter -= coinsToAdd;
                                            }
                                            updateDisplay();
                                            playSound('pointAdd');
                                            setTimeout(countDownPoints, 30);
                                        } else if (isHubiJackpotShowing) {
                                            if (coinCounter > 0) {
                                                coins += 1;
                                            }
                                            // 剩餘積分留著下次用；全消完才從500起跳
                                            hubiPoints = remainingPoints > 0 ? remainingPoints : 500;
                                            updateDisplay();
                                            saveGame();
                                            showMessage('🐶 琥比全盤!! 🐶', true);
                                            isHubiJackpotShowing = false;
                                            superTrigger = totalSpins + Math.floor(Math.random() * 5001) + 30000;
                                            consumeGuaranteedJackpot();
                                            clearPaylines();
                                            clearPayoutHighlights();
                                            document.querySelectorAll('.reel').forEach(reel => {
                                                reel.classList.remove('hubi-jackpot');
                                            });
                                            if (autoSpin) {
                                                startSpecialPauseTimer();
                                            }
                                        }
                                    }
                                    
                                    setTimeout(countDownPoints, 500);
                                }, 2000);
                            } else {
                                isHubiJackpotShowing = false;
                                clearPaylines();
                                document.querySelectorAll('.reel').forEach(reel => {
                                    reel.classList.remove('hubi-jackpot');
                                });
                                // 十字/交叉特別獎：水果全盤跑完後清除所有狀態，背景復歸
                                // 不在此處清獎框，讓它恆亮到下一轉才清除
                                consumeGuaranteedJackpot();
                                if (autoSpin) {
                                    startSpecialPauseTimer();
                                }
                            }
                        }
                    }
                    
                    isHubiJackpotShowing = true;
                    setTimeout(manualScoreWin, 1500);
                } else {
                    const savedFromSpin = savedSpecialType;
                    
                    if (savedFromSpin === 'plus' || savedFromSpin === 'cross') {
                        // 十字/交叉特別獎：跑分動畫（仿照全盤的 manualScoreWin 逐分累加）
                        pendingWin = Math.floor(totalWin);
                        updateWinDisplay(0);
                        
                        function manualScoreWinSpecial() {
                            if (pendingWin > 0) {
                                coins++;
                                pendingWin--;
                                updateWinDisplay(pendingWin);
                                updateDisplay();
                                playSound('pointAdd');
                                setTimeout(manualScoreWinSpecial, 20);
                            } else {
                                isHubiJackpotShowing = false;
                                saveGame();
                                // 重新繪製專屬連線（可能已被後續的 clearPaylines 清除）
                                clearPaylines();
                                if (savedFromSpin === 'plus') {
                                    drawPayline([3, 4, 5]); // 中間橫線
                                    drawPayline([1, 4, 7]); // 中間豎線
                                } else {
                                    drawPayline([0, 4, 8]); // 左上到右下
                                    drawPayline([6, 4, 2]); // 左下到右上
                                }
                                // 恆亮燈框到下一個 spin() 為止
                                specialAwardType = savedFromSpin;
                                guaranteedJackpot = true;
                            }
                        }
                        
                        isHubiJackpotShowing = true;
                        setTimeout(manualScoreWinSpecial, 1500);
                    } else {
                        // 一般連線：維持原行為（立即顯示 WIN 分數，1.5 秒後入幣）
                        updateWinDisplay(totalWin);
                        setTimeout(() => {
                            coins += Math.floor(totalWin);
                            updateDisplay();
                            saveGame();
                            clearPaylines();
                            if (!savedFromSpin) clearPayoutHighlights();
                        }, 1500);
                    }
                }
                
                if (isJackpot) {
                    // 暫停移到各別流程的跑分完成後啟動，避免時間競賽
                    
                    playSound('hubiJackpot');
                    setTimeout(() => playSound('bigWin'), 1200);
                    
                    let jackpotMsg = '';
                    if (isHubiJackpot) {
                        jackpotMsg = '🐶 琥比全盤!! 🐶';
                    } else if (jackpotSymbol === '⭐') {
                        jackpotMsg = '⭐ 星星全盤!! ⭐';
                    } else if (jackpotSymbol === '🔔') {
                        jackpotMsg = '🔔 銅鐘全盤!! 🔔';
                    } else {
                        jackpotMsg = '🎉 全盤大獎!! 🎉';
                    }
                    showMessage(jackpotMsg, isHubiJackpot);
                    
                    document.querySelectorAll('.reel').forEach(reel => {
                        reel.classList.add('hubi-jackpot');
                    });

                    PAYLINES.forEach((line, lineIndex) => {
                        drawPayline(line);
                    });
                    
                    if (!isHubiJackpot) {
                        createCoinRain();
                        createHubiRain();
                    }
                    // 琥比全盤時只下雪 ❄️
                    if (isHubiJackpot) {
                        clearSnow = createSnowFall();
                    }
                    
                    let currentPoints = hubiPointsBeforeAward;
                    let currentWin = totalWin;
                    let effectCounter = 0;
                    
                    function loopJackpotEffects() {
                        effectCounter++;
                        if (effectCounter < 6 && isHubiJackpotShowing) {
                            if (!isHubiJackpot) {
                                createCoinRain();
                                createHubiRain();
                            }
                            setTimeout(loopJackpotEffects, 1000);
                        }
                    }
                    setTimeout(loopJackpotEffects, 1500);
                } else {
                    const specialFlowActive = savedSpecialType; // 記錄特別獎流程中
                    playSound(totalWin >= currentBet * 50 ? 'bigWin' : 'win');
                    
                    clearPaylines();
                    winningLines.forEach(win => {
                        const lineIndices = PAYLINES[win.line];
                        if (lineIndices) {
                            drawPayline(lineIndices);
                        }
                        lineIndices.forEach(index => {
                            document.querySelector(`.reel[data-index="${index}"]`).classList.add('winner');
                        });
                    });
                    
                    // 十字/交叉特別獎：在一般連線之上繪製專屬圖形
                    if ((specialAwardType === 'plus' || specialAwardType === 'cross') && !isJackpot && guaranteedJackpot) {
                        clearPaylines();
                        if (specialAwardType === 'plus') {
                            drawPayline([3, 4, 5]); // 中間橫線
                            drawPayline([1, 4, 7]); // 中間豎線
                        } else {
                            drawPayline([0, 4, 8]); // 左上到右下
                            drawPayline([6, 4, 2]); // 左下到右上
                        }
                    }

                    if (totalWin >= currentBet * 50) {
                        createCoinRain();
                    }

                    setTimeout(() => {
                        if (!(specialFlowActive === 'plus' || specialFlowActive === 'cross')) {
                            clearPaylines();
                        }
                        if (!specialFlowActive) clearPayoutHighlights();
                        document.querySelectorAll('.reel').forEach(reel => {
                            reel.classList.remove('winner');
                        });
                    }, 2000);
                }
            }

            updateDisplay();
            saveGame();
        }

        function showMessage(text, isHubi = false) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.classList.remove('show');
            if (isHubi) {
                message.classList.add('hubi-msg');
            } else {
                message.classList.remove('hubi-msg');
            }
            
            void message.offsetWidth;
            message.classList.add('show');
            setTimeout(() => {
                message.classList.remove('show');
            }, 2500);
        }

        function createCoinRain() {
            const container = document.getElementById('coinsContainer');
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const coin = document.createElement('div');
                    coin.className = 'coin';
                    coin.textContent = '🪙';
                    coin.style.left = Math.random() * 100 + '%';
                    coin.style.top = '-30px';
                    container.appendChild(coin);
                    playSound('coin');
                    
                    setTimeout(() => coin.remove(), 1000);
                }, i * 30);
            }
        }

        function createHubiRain() {
            const container = document.getElementById('coinsContainer');
            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const hubi = document.createElement('div');
                    hubi.className = 'coin';
                    hubi.innerHTML = '<img src="' + HUBI_IMAGE + '" style="width:40px;height:40px;object-fit:contain;">';
                    hubi.style.left = Math.random() * 100 + '%';
                    hubi.style.top = '-30px';
                    container.appendChild(hubi);
                    
                    setTimeout(() => hubi.remove(), 1000);
                }, i * 80);
            }
        }

        function createSnowFall() {
            // Canvas 版雪花 — 高效能，600片不卡跑分
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9999';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            document.getElementById('coinsContainer').appendChild(canvas);
            
            const ctx = canvas.getContext('2d');
            let snowActive = true;
            let animFrameId = null;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            
            // 產生一片雪花
            function createFlake(randomY) {
                const isBig = Math.random() < 0.1;
                const baseSpeed = isBig ? 0.3 + Math.random() * 0.5 : 0.5 + Math.random() * 1.2;
                return {
                    x: Math.random() * canvas.width,
                    y: randomY ? Math.random() * canvas.height * 1.1 : -10 - Math.random() * 30,
                    size: isBig ? 10 + Math.random() * 8 : 1 + Math.random() * 3,
                    speed: baseSpeed,
                    swayAmp: (Math.random() - 0.5) * 2 * (isBig ? 1.5 : 1),
                    swayFreq: 0.003 + Math.random() * 0.008,
                    opacity: isBig ? 0.5 + Math.random() * 0.3 : 0.3 + Math.random() * 0.4,
                    isBig: isBig,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: isBig ? (Math.random() - 0.5) * 0.015 : 0
                };
            }
            
            // 初始化 600 片（散布在整個畫面）
            const flakes = [];
            const SNOWFLAKE_COUNT = 600;
            for (let i = 0; i < SNOWFLAKE_COUNT; i++) {
                flakes.push(createFlake(true));
            }
            
            function drawFlake(f) {
                ctx.save();
                ctx.globalAlpha = f.opacity;
                if (f.isBig) {
                    ctx.font = f.size + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.translate(f.x, f.y);
                    ctx.rotate(f.rotation);
                    ctx.fillStyle = '#fff';
                    ctx.fillText('❄', 0, 0);
                } else {
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, f.size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                }
                ctx.restore();
            }
            
            function loop() {
                if (!snowActive) {
                    canvas.remove();
                    window.removeEventListener('resize', resize);
                    return;
                }
                
                // 更新位置
                for (let i = 0; i < flakes.length; i++) {
                    const f = flakes[i];
                    f.y += f.speed;
                    f.x += Math.sin(f.y * f.swayFreq) * f.swayAmp;
                    f.rotation += f.rotSpeed;
                    
                    // 超出底部就從頂部重生
                    if (f.y > canvas.height + 30) {
                        const nf = createFlake(false);
                        nf.x = Math.random() * canvas.width;
                        flakes[i] = nf;
                    }
                }
                
                // 全部清除 + 繪製（一次完成最省效能）
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < flakes.length; i++) {
                    drawFlake(flakes[i]);
                }
                
                animFrameId = requestAnimationFrame(loop);
            }
            
            animFrameId = requestAnimationFrame(loop);
            
            return () => {
                snowActive = false;
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }
                canvas.remove();
                window.removeEventListener('resize', resize);
            };
        }

        function changeBet(delta) {
            if (autoSpin) {
                showMessage('⛔ 自動轉動中，請先按停止再調整押分', false);
                return;
            }
            if (guaranteedJackpot) {
                showMessage('⛔ 特別獎流程中，不得調整押分', false);
                return;
            }
            betIndex = Math.max(0, Math.min(BET_OPTIONS.length - 1, betIndex + delta));
            currentBet = BET_OPTIONS[betIndex];
            updateDisplay();
            updateBetButtonsState();
        }

        function updateBetButtonsState() {
            const locked = autoSpin || guaranteedJackpot;
            document.querySelectorAll('.btn-bet').forEach(btn => {
                btn.classList.toggle('disabled', locked);
                btn.disabled = locked;
            });
        }

        document.getElementById('spinBtn').addEventListener('click', () => {
            clearSpecialPauseTimer();
            spin();
        });
        document.getElementById('autoSpinBtn').addEventListener('click', () => {
            clearSpecialPauseTimer();
            autoSpin = !autoSpin;
            updateBetButtonsState();
            const btn = document.getElementById('autoSpinBtn');
            if (autoSpin) {
                isHubiJackpotShowing = false;
                clearPaylines();
                document.querySelectorAll('.reel').forEach(reel => {
                    reel.classList.remove('hubi-jackpot');
                });
                btn.classList.add('active');
                btn.textContent = 'STOP';
                if (!isSpinning && coins >= currentBet) {
                    spin();
                }
            } else {
                btn.classList.remove('active');
                btn.textContent = 'AUTO';
                clearPaylines();
                if (autoSpinInterval) {
                    clearTimeout(autoSpinInterval);
                    autoSpinInterval = null;
                }
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '5') {
                e.preventDefault();
                coins += 100;
                updateDisplay();
                saveGame();
            }
        });
        document.getElementById('betUp').addEventListener('click', () => changeBet(1));
        document.getElementById('betDown').addEventListener('click', () => changeBet(-1));
        document.getElementById('betMax').addEventListener('click', () => {
            if (autoSpin) {
                showMessage('⛔ 自動轉動中，請先按停止再調整押分', false);
                return;
            }
            if (guaranteedJackpot) {
                showMessage('⛔ 特別獎流程中，不得調整押分', false);
                return;
            }
            betIndex = BET_OPTIONS.length - 1;
            currentBet = BET_OPTIONS[betIndex];
            updateDisplay();
            updateBetButtonsState();
        });

        document.getElementById('soundToggle').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !isSpinning) {
                spin();
            }
        });

        let takeBtnClickCount = 0;
        let lastTakeBtnClickTime = 0;

        document.getElementById('takeBtn').addEventListener('click', () => {
            const now = Date.now();
            if (now - lastTakeBtnClickTime > 2000) {
                takeBtnClickCount = 0;
            }
            lastTakeBtnClickTime = now;
            
            if (coins < 10) {
                takeBtnClickCount++;
                if (takeBtnClickCount >= 3) {
                    coins = 1000;
                    takeBtnClickCount = 0;
                    updateDisplay();
                    saveGame();
                    showMessage('獲得 1000 分!', false);
                } else {
                    showMessage('再按 ' + (3 - takeBtnClickCount) + ' 次獲得1000分', false);
                }
                return;
            }
            
            if (pendingWin > 0) {
                takeWin();
            }
        });


        loadGame();
        updateDisplay();
        
        // 初始化框格顯示：用 SVGs 取代初始 emoji
        document.querySelectorAll('.reel').forEach(reel => {
            const defaultSymbols = ['🍉', '🍊', '🍇', '🍋', '🔔', '⭐', '🍇', '🍊', '🍉'];
            const idx = parseInt(reel.dataset.index);
            reel.innerHTML = getSymbolContent(defaultSymbols[idx]);
        });
    </script>
</body>
</html>
