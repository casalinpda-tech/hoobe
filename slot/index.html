<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>琥比水果盤 — 位子先留著 | HOOBE</title>
<meta name="description" content="HOOBE 琥比水果盤施工中。位子先留著，做好直接從這裡進去。">
<link rel="icon" href="../assets/hub.gif">
<style>
  :root{ --case:#242526; --case2:#3a3b3c; --line:#4a4c4e;
         --lcd:#b3b1a3; --lcd2:#a7a596; --ink:#14140f;
         --teal:#2fb8a8; --gold:#c9a227; --red:#b3202a; }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:#141617}
  body{min-height:100vh}
  body{ background-color:#141617; background-image:radial-gradient(circle at 50% 0%, #2b2f31 0%, #141617 70%);
    background-repeat:no-repeat; background-size:100% 1400px;
        color:#e7eaea; font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
        padding:28px 18px 60px; -webkit-font-smoothing:antialiased }
  .wrap{max-width:820px; margin:0 auto}
  a.back{color:#9aa0a3; text-decoration:none; font-size:13px; letter-spacing:1px}
  a.back:hover{color:var(--teal)}
  .machine{ margin-top:16px; background:linear-gradient(180deg,var(--case2) 0%,var(--case) 100%);
            border-radius:18px; padding:20px 22px 22px;
            box-shadow:0 26px 56px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.13), inset 0 -2px 0 rgba(0,0,0,.5) }
  .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px}
  .head b{letter-spacing:4px; font-size:14px; color:#d5d9db}
  .head span{font-size:11px; letter-spacing:2px; color:var(--gold)}
  h1{margin:2px 0 10px; font-size:26px; letter-spacing:2px}
  .lede{margin:0 0 20px; color:#b6bcbe; font-size:14.5px; line-height:1.8}
  /* 液晶窗 */
  .lcd{ background:linear-gradient(160deg,#c0beb0 0%,var(--lcd) 38%,var(--lcd2) 72%,#b8b6a8 100%);
        border-radius:10px; padding:18px 16px; position:relative; overflow:hidden;
        box-shadow:inset 0 0 28px rgba(0,0,0,.22), 0 0 0 6px #1c1d1e, 0 0 0 7px var(--line) }
  .lcd::before{content:""; position:absolute; inset:0; pointer-events:none;
        background:linear-gradient(118deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,.04) 26%, transparent 52%)}
  .lcd::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
        background:repeating-linear-gradient(0deg, rgba(0,0,0,.055) 0 1px, transparent 1px 3px)}
  .lcd > *{position:relative; z-index:2}
  .win{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; font-family:"Courier New",monospace }
  .reel{ background:linear-gradient(180deg,#cfccbd,#b6b3a4); border-radius:8px; padding:8px 0;
         box-shadow:inset 0 0 18px rgba(0,0,0,.35), 0 0 0 4px #1c1d1e }
  .reel .sym{ display:block; text-align:center; font:700 26px/1.7 "Courier New",monospace;
              color:rgba(20,20,15,.30); text-shadow:0 0 .5px rgba(20,20,15,.3) }
  .reel .sym.lit{ color:var(--ink); background:rgba(255,255,255,.45);
                  box-shadow:inset 0 0 0 1px rgba(20,20,15,.25); text-shadow:0 0 .8px rgba(20,20,15,.6) }
  .line{ margin-top:16px; font-family:"Courier New",monospace; font-size:13px; color:var(--ink);
         display:grid; grid-template-columns:1fr auto; gap:6px 14px; border-top:2px solid rgba(20,20,15,.5); padding-top:10px }
  .line .k{letter-spacing:1px}
  .line .v{font-weight:700; text-align:right}
  .note{ margin-top:14px; font-family:"Courier New",monospace; font-size:12px; color:var(--ink);
         background:rgba(20,20,15,.10); padding:8px 10px; border-radius:4px }
  h2{font-size:15px; letter-spacing:1.5px; color:var(--teal); margin:22px 0 8px}
  ul{margin:0; padding-left:20px; color:#c2c7c9; font-size:14px; line-height:2}
  .foot{margin-top:24px; color:#8d9395; font-size:12.5px; text-align:center; line-height:2}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../">◀ 回琥比遊戲間</a>

  <div class="machine">
    <div class="head"><b>HOOBE</b><span>施工中</span></div>
    <h1>琥比水果盤</h1>
    <p class="lede">位子先留著。機台在另一台電腦上施工 —— 你看到的是這一格未來的樣子。</p>

    <div class="lcd">
      <div class="win">
        <div class="reel"><span class="sym ">★</span><span class="sym lit">7</span><span class="sym ">BAR</span></div>
        <div class="reel"><span class="sym ">7</span><span class="sym lit">BAR</span><span class="sym ">★</span></div>
        <div class="reel"><span class="sym ">BAR</span><span class="sym lit">★</span><span class="sym ">7</span></div>
      </div>
      <div class="line">
        <span class="k">押注</span><span class="v">等待機台完工</span>
        <span class="k">籌碼</span><span class="v">無限</span>
        <span class="k">狀態</span><span class="v">施工中</span>
      </div>
      <div class="note">本頁為入口預留位置，不是可玩的機台。</div>
    </div>

    <h2>做好之後會有的東西</h2>
    <ul>
      <li>三軸、液晶押注列、開獎歷史 —— 跟輪盤同一套老機台的味道</li>
      <li>籌碼無限，補幣自動化（不用按到手酸）</li>
      <li>看得到別人、排行榜、聊天 —— 熱鬧是玩的理由</li>
      <li>連線版與輪盤多人版共用同一套後端，做一次兩個都能連</li>
    </ul>
  </div>

  <div class="foot">輪盤現在就可以玩 → <a class="back" href="../roulette/" style="color:#2fb8a8">完整版輪盤</a></div>
</div>
</body>
</html>
