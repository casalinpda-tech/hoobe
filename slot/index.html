<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>琥比水果盤</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #0a3d0a 0%, #0d5c1a 50%, #0a3d0a 100%);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(255,215,0,0.1) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0,0,0,0.1) 50px, rgba(0,0,0,0.1) 51px);
            pointer-events: none;
            z-index: 1000;
        }

        .game-container {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 
                0 0 0 4px #ffd700,
                0 0 30px rgba(255,215,0,0.5),
                inset 0 0 60px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 900px;
        }

        .game-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 18px;
            color: #ffd700;
            text-shadow: 
                0 0 10px #ffd700,
                2px 2px 0 #ff4444,
                -1px -1px 0 #006400;
            letter-spacing: 2px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px #ffd700, 2px 2px 0 #ff4444; }
            50% { text-shadow: 0 0 20px #ffd700, 2px 2px 0 #ff4444, 0 0 30px #ffd700; }
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 10px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border: 2px solid #ffd700;
            width: 100%;
            max-width: 720px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 3px;
        }

        .stat-value {
            font-size: 20px;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        .stat-value.hubi {
            color: #ff6b6b;
            text-shadow: 0 0 10px #ff4444;
        }

        .slot-machine {
            background: linear-gradient(180deg, #2a2a4a 0%, #1a1a2e 100%);
            border-radius: 15px;
            padding: 15px;
            border: 3px solid #ffd700;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .right-panel {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .reels-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            background: #0a0a15;
            padding: 8px;
            border-radius: 10px;
            border: 2px solid #333;
            flex-shrink: 0;
        }

        .reel {
            width: 130px;
            height: 130px;
            background: linear-gradient(180deg, #fff 0%, #f0f0f0 50%, #e0e0e0 100%);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
            box-shadow: 
                inset 0 -5px 15px rgba(0,0,0,0.3),
                0 3px 10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: background 0.3s;
        }

        .reel.guaranteed {
            background: linear-gradient(180deg, #b0e0e6 0%, #87ceeb 50%, #b0e0e6 100%);
            animation: guaranteedPulse 0.5s ease-in-out infinite;
            box-shadow: 0 0 10px #87ceeb, inset 0 -5px 15px rgba(0,0,0,0.3);
        }

        .reel.guaranteed.cross-bg {
            background: linear-gradient(180deg, #ffc0cb 0%, #ff69b4 50%, #ffc0cb 100%);
            animation-name: guaranteedPulseCross;
            box-shadow: 0 0 10px #ff69b4, inset 0 -5px 15px rgba(0,0,0,0.3);
        }

        .reel.hubi-jackpot {
            animation: hubiJackpot 0.3s ease-in-out infinite;
        }

        /* 滿天星模式下改灰階邊框，消除光害 */
        .starry-active .reel.guaranteed,
        .starry-active .reel.hubi-jackpot {
            border: none !important;
            box-shadow: inset 0 0 0 1px #555 !important;
            animation: none !important;
            transform: none !important;
            background: radial-gradient(ellipse at 50% 40%, #0d0d3a 0%, #080820 60%, #000 100%) !important;
        }

        @keyframes guaranteedPulse {
            0%, 100% { box-shadow: 0 0 10px #87ceeb, inset 0 -5px 15px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 20px #87ceeb, 0 0 30px #b0e0e6, inset 0 -5px 15px rgba(0,0,0,0.3); }
        }

        @keyframes guaranteedPulseCross {
            0%, 100% { box-shadow: 0 0 10px #ff69b4, inset 0 -5px 15px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 0 20px #ff69b4, 0 0 30px #ffc0cb, inset 0 -5px 15px rgba(0,0,0,0.3); }
        }

        .reel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .reel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, transparent 100%);
            pointer-events: none;
        }

        .reel.spinning {
            animation: none;
        }

        .reel.spinning .reel-symbol {
            animation: spinBlur 0.1s infinite;
        }

        @keyframes spinBlur {
            0% { filter: blur(2px); transform: translateY(-10px); }
            50% { filter: blur(4px); transform: translateY(0); }
            100% { filter: blur(2px); transform: translateY(10px); }
        }

        .reel-symbol {
            transition: transform 0.1s;
            line-height: 1;
        }
        .reel-symbol img {
            width: 88px;
            height: 88px;
            display: block;
            pointer-events: none;
            user-select: none;
        }
        .payout-svg {
            width: 13px;
            height: 13px;
            vertical-align: middle;
            margin: 0 1px;
        }
        .special-svg {
            width: 11px;
            height: 11px;
            vertical-align: middle;
        }

        .reel.winner {
            animation: winnerPulse 0.5s ease-in-out infinite;
        }

        .reel.hubi-jackpot {
            animation: hubiJackpot 0.3s ease-in-out infinite;
        }

        @keyframes hubiJackpot {
            0%, 100% { 
                box-shadow: 0 0 20px #ffd700, 0 0 40px #ffaa00, inset 0 -5px 15px rgba(0,0,0,0.3); 
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 40px #ffd700, 0 0 60px #ffaa00, 0 0 80px #ffd700, inset 0 -5px 15px rgba(0,0,0,0.3); 
                transform: scale(1.05);
            }
        }

        @keyframes winnerPulse {
            0%, 100% { 
                box-shadow: 0 0 10px #ffd700, inset 0 -5px 15px rgba(0,0,0,0.3); 
            }
            50% { 
                box-shadow: 0 0 30px #ffd700, 0 0 50px #ffd700, inset 0 -5px 15px rgba(0,0,0,0.3); 
            }
        }

        .paylines-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            pointer-events: none;
            z-index: 10;
        }

        .payline {
            position: absolute;
            height: 3px;
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .payline.active {
            opacity: 1;
            animation: paylineFlash 0.3s ease-in-out infinite;
        }

        @keyframes paylineFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
            clear: both;
        }

        .btn {
            padding: 12px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-spin {
            background: linear-gradient(180deg, #ff6b6b 0%, #ee5a5a 50%, #c94444 100%);
            color: white;
            padding: 15px 40px;
            box-shadow: 0 4px 0 #a33333, 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-spin:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #a33333, 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-spin:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a33333, 0 3px 10px rgba(0,0,0,0.3);
        }

        .btn-auto {
            background: linear-gradient(180deg, #9b59b6 0%, #8e44ad 50%, #6c3483 100%);
            color: white;
            font-size: 14px;
            padding: 15px 25px;
            box-shadow: 0 4px 0 #4a235a, 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-auto:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #4a235a, 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-auto:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #4a235a, 0 3px 10px rgba(0,0,0,0.3);
        }

        .btn-auto.active {
            background: linear-gradient(180deg, #e74c3c 0%, #c0392b 50%, #922b21 100%);
            box-shadow: 0 4px 0 #641e16, 0 6px 15px rgba(0,0,0,0.3);
            animation: autoPulse 1s ease-in-out infinite;
        }

        .btn-take {
            background: linear-gradient(180deg, #f39c12 0%, #e67e22 50%, #d35400 100%);
            color: white;
            padding: 15px 15px;
            box-shadow: 0 4px 0 #a04000, 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-take:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #a04000, 0 8px 20px rgba(0,0,0,0.3);
        }

        .btn-take:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #a04000, 0 3px 10px rgba(0,0,0,0.3);
        }

        @keyframes autoPulse {
            0%, 100% { box-shadow: 0 4px 0 #641e16, 0 6px 15px rgba(0,0,0,0.3); }
            50% { box-shadow: 0 4px 0 #641e16, 0 6px 25px rgba(231, 76, 60, 0.6); }
        }

        .btn-bet {
            background: linear-gradient(180deg, #4a90d9 0%, #3a7bc8 50%, #2a5aa8 100%);
            color: white;
            box-shadow: 0 4px 0 #1a4a88, 0 6px 15px rgba(0,0,0,0.3);
        }

        .btn-bet:hover {
            transform: translateY(-2px);
        }

        .btn-bet:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a4a88;
        }
        .btn-bet.disabled {
            background: linear-gradient(180deg, #555 0%, #444 50%, #333 100%);
            box-shadow: 0 2px 0 #222, 0 4px 10px rgba(0,0,0,0.2);
            cursor: not-allowed;
            transform: none !important;
            opacity: 0.6;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .bet-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
        }

        .bet-label {
            color: #aaa;
            font-size: 12px;
        }

        .bet-value {
            color: #ffd700;
            font-size: 18px;
            min-width: 60px;
            text-align: center;
        }

        .special-awards {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-shrink: 0;
            width: 100px;
        }

        .special-box {
            background: rgba(0,0,0,0.4);
            border-radius: 5px;
            padding: 5px;
            text-align: center;
        }

        .special-title {
            font-size: 9px;
            color: #ffd700;
            margin-bottom: 3px;
        }

        .special-imgs {
            font-size: 10px;
        }
        .special-imgs span {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hubi-box .special-imgs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            justify-items: center;
        }

        .hubi-box {
            border: 1px solid #ffd700;
        }

        .super-box {
            border: 1px solid #e74c3c;
        }

        .cross-box {
            border: 1px solid #ff69b4;
        }

        .plus-box {
            border: 1px solid #3498db;
        }

        .studio-box {
            border: 3px double #8e44ad;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 68px;
        }
        .studio-box .studio-text {
            font-size: 9px;
            color: #ffd700;
            line-height: 1.4;
            padding: 2px 0;
        }

        .payout-table {
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border: 1px solid #ffd700;
            flex-shrink: 0;
            width: 160px;
        }

        .payout-title {
            font-size: 11px;
            color: #ffd700;
            text-align: center;
            margin-bottom: 8px;
        }

        .payout-items {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 10px;
        }

        .payout-item {
            background: rgba(255,215,0,0.1);
            padding: 3px 6px;
            border-radius: 3px;
            color: #ddd;
            display: flex;
            justify-content: space-between;
        }

        .payout-item span {
            color: #ffd700;
        }

        .payout-item.hubi-item {
            background: rgba(255,215,0,0.2);
        }

        .payout-item.hubi-item span {
            color: #ffd700;
        }

        .payout-item.highlight, .special-box.highlight {
            animation: payoutGlow 0.5s ease-in-out infinite alternate;
            background: rgba(255, 215, 0, 0.5) !important;
            box-shadow: 0 0 15px rgba(255,215,0,0.8);
        }

        @keyframes payoutGlow {
            from { background: rgba(255, 215, 0, 0.4) !important; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
            to { background: rgba(255, 215, 0, 0.7) !important; box-shadow: 0 0 20px rgba(255,215,0,1), 0 0 30px rgba(255,215,0,0.5); }
        }

        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            color: #ffd700;
            text-shadow: 
                0 0 20px #ffd700,
                2px 2px 0 #ff4444;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .message.hubi-msg {
            color: #ff6b6b;
            text-shadow: 
                0 0 20px #ff6b6b,
                0 0 40px #ff4444,
                2px 2px 0 #ffd700;
            font-size: 24px;
        }

        .message.show {
            opacity: 1;
            animation: messagePop 0.5s ease-out;
        }

        @keyframes messagePop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .coins-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        .coin {
            position: absolute;
            font-size: 24px;
            animation: coinFall 1s ease-in forwards;
        }

        @keyframes coinFall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg); }
            100% { opacity: 0; transform: translateY(200px) rotate(360deg); }
        }

        /* 雪花飄落 */
        .snowflake {
            position: fixed;
            background: #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }
        @keyframes snowFall {
            0% { transform: translateY(-10px) translateX(0); opacity: 0.8; }
            25% { transform: translateY(25vh) translateX(8px); opacity: 0.7; }
            50% { transform: translateY(50vh) translateX(-5px); opacity: 0.6; }
            75% { transform: translateY(75vh) translateX(10px); opacity: 0.5; }
            100% { transform: translateY(105vh) translateX(-3px); opacity: 0; }
        }
        @keyframes snowFallSlow {
            0% { transform: translateY(-10px) translateX(0); opacity: 0.8; }
            20% { transform: translateY(20vh) translateX(-12px); opacity: 0.7; }
            40% { transform: translateY(40vh) translateX(8px); opacity: 0.6; }
            60% { transform: translateY(60vh) translateX(-6px); opacity: 0.5; }
            80% { transform: translateY(80vh) translateX(14px); opacity: 0.3; }
            100% { transform: translateY(105vh) translateX(-5px); opacity: 0; }
        }

        /* 滿天星空閃爍效果 */
        .starry-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
            border-radius: 16px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .starry-overlay.active {
            opacity: 1;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle var(--dur) ease-in-out infinite alternate;
        }
        .star:nth-child(odd) { animation-delay: calc(var(--dur) * -0.3); }
        .star:nth-child(3n) { width: 3px; height: 3px; }
        .star:nth-child(5n) { width: 1px; height: 1px; }
        .star:nth-child(7n) { width: 4px; height: 4px; background: #eef; box-shadow: 0 0 4px rgba(200,200,255,0.6); }
        .star:nth-child(11n) { width: 5px; height: 5px; background: #fff8dc; box-shadow: 0 0 6px rgba(255,255,200,0.7); }
        .star:nth-child(12n) { width: 1px; height: 1px; animation: none; opacity: 0.3; }
        /* 固定不閃爍的小繁星 */
        .star-fixed {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            opacity: 0.35;
            animation: none;
        }
        .star-fixed:nth-child(3n) { width: 1px; height: 1px; opacity: 0.2; }
        /* 點綴大星：十字光芒 */
        .big-star {
            position: absolute;
            pointer-events: none;
            z-index: 6;
        }
        .big-star .core {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 3px 1px currentColor;
        }
        .big-star .ray {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 1px;
        }
        .big-star .ray-h {
            width: 8px;
            height: 1px;
            box-shadow: 0 0 2px 1px currentColor;
        }
        .big-star .ray-v {
            width: 1px;
            height: 8px;
            box-shadow: 0 0 2px 1px currentColor;
        }
        .big-star .ray-d1 {
            width: 5px;
            height: 1px;
            transform: translate(-50%, -50%) rotate(45deg);
            box-shadow: 0 0 1px 0.5px currentColor;
        }
        .big-star .ray-d2 {
            width: 5px;
            height: 1px;
            transform: translate(-50%, -50%) rotate(-45deg);
            box-shadow: 0 0 1px 0.5px currentColor;
        }
        .big-star.color-blue { color: #6699ff; }
        .big-star.color-pink { color: #ff66aa; }
        .big-star.color-gold { color: #ffdd44; }
        @keyframes twinkle {
            0% { opacity: 0.5; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .sound-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .total-spins {
            font-size: 10px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <button class="sound-toggle" id="soundToggle">🔊</button>
        
        <div class="game-header">
            <h1 class="game-title">琥比水果盤</h1>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-label">CREDIT</div>
                <div class="stat-value" id="coins">1000</div>
            </div>
            <div class="stat">
                <div class="stat-label">WIN</div>
                <div class="stat-value" id="win">0</div>

    <script>
        const HUBI_SYMBOL = 'HUBI';
        const HUBI_IMAGE = 'hoobe.gif';
        const SYMBOLS = ['🍉', '🍊', '🍇', '🍋', '🍒', '🔔', '⭐', 'HUBI'];
        const PAYOUTS = {
            '⭐': 10,
            '🔔': 5,
            '🍒': 1.2,
            '🍋': 1.2,
            '🍇': 1.2,
            '🍊': 1.2,
            '🍉': 3,
            'HUBI': 50
        };
        const ALL_PAYOUTS = {
            'HUBI': 300,
            '⭐': 150,
            '🔔': 100,
            '🍉': 80,
            '🍊': 60,
            '🍇': 60,
            '🍋': 60,
            '🍒': 60
        };
        const BET_OPTIONS = [10, 20, 30, 50, 100];
        const HUBI_POINTS_PER_JACKPOT = 100;

        const PAYLINES = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [6, 4, 2]
        ];

        let coins = 1000;
        let currentBet = 10;
        let betIndex = 0;
        let isSpinning = false;
        let soundEnabled = true;
        let hubiPoints = 500;
        let totalSpins = 0;
        let hubiJackpotCount = 0;
        let autoSpin = false;
        let autoSpinInterval = null;
        let clearSnow = null;
        let lastHubiJackpotSpin = -500;
        let isHubiJackpotShowing = false;
        let guaranteedJackpot = false;
        let normalJackpotTrigger = Math.floor(Math.random() * 700) + 800;
        let plusAwardTrigger = Math.floor(Math.random() * 200) + 500;
        let superTrigger = Math.floor(Math.random() * 5001) + 30000;
        let pendingWin = 0;
        let isManualTake = false;
        let specialAwardType = null;
        let savedSpecialType = null;
        let specialPauseTimer = null; // 特別獎10秒暫停計時器
        let persistentSpecialBg = null; // 特別獎流程中保留的背景色（跨轉動保留）
        
        function clearSpecialPauseTimer() {
            if (specialPauseTimer) {
                clearTimeout(specialPauseTimer);
                specialPauseTimer = null;
            }
        }
        
        function startSpecialPauseTimer() {
            clearSpecialPauseTimer();
            specialPauseTimer = setTimeout(() => {
                specialPauseTimer = null;
                // 10秒到，如果 autoSpin 還在 true 就繼續自動轉動
                if (autoSpin && !isSpinning && coins >= currentBet) {
                    spin();
                }
            }, 10000);
        }
        
        const JACKPOT_SYMBOLS = ['🍉', '🍊', '🍇', '🍋', '🍒', '🔔', '⭐', 'HUBI'];

        const NOTO_SVG = {
            '🍉': 'noto_emoji/西瓜.svg',
            '🍊': 'noto_emoji/柳橙.svg',
            '🍇': 'noto_emoji/葡萄.svg',
            '🍋': 'noto_emoji/檸檬.svg',
            '🍒': 'noto_emoji/櫻桃.svg',
            '🔔': 'noto_emoji/鈴鐺.svg',
            '⭐': 'noto_emoji/星星.svg',
        };

        function getSymbolContent(symbol) {
            if (symbol === 'HUBI') {
                return '<span class="reel-symbol"><img src="' + HUBI_IMAGE + '" alt="琥比"></span>';
            }
            if (NOTO_SVG[symbol]) {
                return '<span class="reel-symbol"><img src="' + NOTO_SVG[symbol] + '" alt="' + symbol + '"></span>';
            }
            return '<span class="reel-symbol">' + symbol + '</span>';
        }

        function loadGame() {
            const saved = localStorage.getItem('slotMachineSave');
            if (saved) {
                const data = JSON.parse(saved);
                coins = data.coins || 1000;
                hubiPoints = data.hubiPoints || 500;
                totalSpins = data.totalSpins || 0;
                hubiJackpotCount = data.hubiJackpotCount || 0;
                lastHubiJackpotSpin = data.lastHubiJackpotSpin || -500;
                plusAwardTrigger = data.plusAwardTrigger || (Math.floor(Math.random() * 200) + 500);
                normalJackpotTrigger = data.normalJackpotTrigger || (totalSpins + Math.floor(Math.random() * 700) + 800);
                superTrigger = data.superTrigger || (Math.floor(Math.random() * 5001) + 30000);
            } else {
                hubiPoints = 500;
                normalJackpotTrigger = Math.floor(Math.random() * 700) + 800;
                plusAwardTrigger = Math.floor(Math.random() * 200) + 500;
            }
            guaranteedJackpot = false;
            guaranteedSpecialJackpot = null;
        }

        function saveGame() {
            const data = {
                coins: coins,
                hubiPoints: hubiPoints,
                totalSpins: totalSpins,
                hubiJackpotCount: hubiJackpotCount,
                lastHubiJackpotSpin: lastHubiJackpotSpin,
                plusAwardTrigger: plusAwardTrigger,
                normalJackpotTrigger: normalJackpotTrigger,
                superTrigger: superTrigger
            };
            localStorage.setItem('slotMachineSave', JSON.stringify(data));
        }

        function resetGame() {
            coins = 1000;
            currentBet = 10;
            betIndex = 0;
            hubiPoints = 500;
            totalSpins = 0;
            hubiJackpotCount = 0;
            superTrigger = Math.floor(Math.random() * 5001) + 30000;
            autoSpin = false;
            saveGame();
            updateDisplay();
        }

        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            switch(type) {
                case 'spin':
                    oscillator.frequency.setValueAtTime(200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
                case 'win':
                    oscillator.frequency.setValueAtTime(523, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(784, audioContext.currentTime + 0.2);
                    oscillator.frequency.setValueAtTime(1047, audioContext.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                    break;
                case 'bigWin':
                    const notes = [523, 659, 784, 880, 1047, 1175, 1319, 1568];
                    notes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.08);
                        gain.gain.setValueAtTime(0.15, audioContext.currentTime + i * 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.08 + 0.15);
                        osc.start(audioContext.currentTime + i * 0.08);
                        osc.stop(audioContext.currentTime + i * 0.08 + 0.15);
                    });
                    break;
                case 'hubiJackpot':
                    const hubiNotes = [262, 330, 392, 523, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349, 2637];
                    hubiNotes.forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = i % 2 === 0 ? 'square' : 'sawtooth';
                        osc.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.05);
                        gain.gain.setValueAtTime(0.2, audioContext.currentTime + i * 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + i * 0.05 + 0.15);
                        osc.start(audioContext.currentTime + i * 0.05);
                        osc.stop(audioContext.currentTime + i * 0.05 + 0.15);
                    });
                    setTimeout(() => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(2093, audioContext.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(4186, audioContext.currentTime + 0.3);
                        gain.gain.setValueAtTime(0.25, audioContext.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                        osc.start(audioContext.currentTime);
                        osc.stop(audioContext.currentTime + 0.5);
                    }, 800);
                    break;
                case 'award':
                    oscillator.type = 'triangle';
                    oscillator.frequency.setValueAtTime(440, audioContext.currentTime);
                    oscillator.frequency.setValueAtTime(554, audioContext.currentTime + 0.15);
                    oscillator.frequency.setValueAtTime(659, audioContext.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                    break;
                case 'pointAdd':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
                case 'stop':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 0.08);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.08);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.08);
                    break;
                case 'coin':
                    oscillator.frequency.setValueAtTime(1200, audioContext.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(2000, audioContext.currentTime + 0.05);
                    gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.1);
                    break;
            }
        }

        function takeWin() {
            if (pendingWin > 0 && !isManualTake) {
                isManualTake = true;
                let winToTake = pendingWin;
                pendingWin = 0;
                
                function countUpWin() {
                    if (winToTake > 0) {
                        const step = Math.min(winToTake, 100);
                        coins += step;
                        winToTake -= step;
                        updateWinDisplay(winToTake);
                        playSound('pointAdd');
                        setTimeout(countUpWin, 10);
                    } else {
                        coins += Math.floor(pendingWin);
                        pendingWin = 0;
                        updateDisplay();
                        saveGame();
                        isManualTake = false;
                        
                        if (specialAwardType === 'cross') {
                            autoSpin = false;
                            const autoBtn = document.getElementById('autoSpinBtn');
                            autoBtn.classList.remove('active');
                            autoBtn.textContent = 'AUTO';
                            setNextJackpotType('cross');
                            consumeGuaranteedJackpot();
                        } else if (specialAwardType === 'plus') {
                            autoSpin = false;
                            const autoBtn = document.getElementById('autoSpinBtn');
                            autoBtn.classList.remove('active');
                            autoBtn.textContent = 'AUTO';
                            setNextJackpotType('plus');
                            consumeGuaranteedJackpot();
                        }
                        // 超級特別獎：TAKE 只加速得分，不復歸背景，等琥比積分跑完後才復歸
                    }
                }
                countUpWin();
            } else if (pendingWin > 0 && isManualTake) {

        function drawPayline(lineIndices) {
            const overlay = document.getElementById('paylinesOverlay');
            const reels = document.querySelectorAll('.reel');
            
            const positions = lineIndices.map(i => {
                const reel = reels[i];
                const container = document.getElementById('reelsContainer');
                const rect = reel.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();
                return {
                    left: rect.left - containerRect.left,
                    right: rect.left - containerRect.left + rect.width,
                    top: rect.top - containerRect.top,
                    bottom: rect.top - containerRect.top + rect.height,
                    centerX: rect.left - containerRect.left + rect.width / 2,
                    centerY: rect.top - containerRect.top + rect.height / 2
                };
            });

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.position = 'absolute';
            svg.style.top = '0';
            svg.style.left = '0';
            svg.style.width = '100%';
            svg.style.height = '100%';
            svg.style.pointerEvents = 'none';
            svg.style.zIndex = '20';

            let x1, y1, x2, y2;
            
            const row0 = Math.floor(lineIndices[0] / 3);
            const row1 = Math.floor(lineIndices[1] / 3);
            const row2 = Math.floor(lineIndices[2] / 3);
            const col0 = lineIndices[0] % 3;
            const col1 = lineIndices[1] % 3;
            const col2 = lineIndices[2] % 3;

            if (row0 === row1 && row1 === row2) {
                x1 = positions[0].left;
                y1 = positions[0].centerY;
                x2 = positions[2].right;
                y2 = positions[2].centerY;
            } else if (col0 === col1 && col1 === col2) {
                x1 = positions[0].centerX;
                y1 = positions[0].top;
                x2 = positions[2].centerX;
                y2 = positions[2].bottom;
            } else if (row0 > row2) {
                x1 = positions[0].left;
                y1 = positions[0].bottom;
                x2 = positions[2].right;
                y2 = positions[2].top;
            } else {
                x1 = positions[0].left;
                y1 = positions[0].top;
                x2 = positions[2].right;
                y2 = positions[2].bottom;
            }

            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#ff0000');
            line.setAttribute('stroke-width', '4');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('filter', 'drop-shadow(0 0 3px #ff0000)');

            svg.appendChild(line);
            overlay.appendChild(svg);
        }

        function shouldTriggerJackpot() {
            if (guaranteedJackpot) {
                guaranteedJackpot = false;
                return true;
            }
            if (totalSpins >= normalJackpotTrigger) {
                normalJackpotTrigger = totalSpins + Math.floor(Math.random() * 700) + 800;
